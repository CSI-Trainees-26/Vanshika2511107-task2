<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Fitness Tracker</h2>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li><a class="nav-link active" href="index.html">Dashboard🏠</a></li>
                    <li><a href="task.html">Task✅</a></li>
                    <li><a href="habits.html">Habits🏃</a></li>
                    <li><a href="water.html">Water💧</a></li>
                    <li><a href="sleep.html">Sleep😴</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="dashboard-header">
                <h1>Hello....!</h1>
                <p id="current-date"></p>
            </header>
            <section class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Tasks</h3>
                        <p class="stat-value">3/5</p>
                        <div class="progress-bar">
                            <div class="progress"></div>
                        </div>

                    </div>
                    <div class="stat-card">
                        <h3>Habits</h3>
                        <p class="stat-value">4/6</p>
                        <div class="progress-bar">
                            <div class="progress"></div>
                        </div>

                    </div>
                    <div class="stat-card">
                        <h3>Water</h3>
                        <p class="stat-value">2.5L</p>
                        <div class="progress-bar">
                            <div class="progress"></div>
                        </div>

                    </div>
                    <div class="stat-card">
                        <h3>Calories</h3>
                        <p class="stat-value">1200 kcal</p>
                    </div>
                    <div class="stat-card">
                        <h3>Sleep</h3>
                        <p class="stat-value">8 hours</p>
                    </div>


                </div>
               <section class="motivation-section">
                 <h2>Daily Motivation</h2>
                <blockquote id="quote-text">Your Future Is Shaped by the Habits You Repeat</blockquote>
                 <button id="new-quote-btn">New Quote</button>
                 <button id="save-quote-btn">Save Quote</button>
                </section>
                <section class="pomodoro-section">
                <h2>Pomodoro-Timer</h2>
                <div id="timer-display">25:00</div>
                 <button id="start-btn">Start</button>
                 <button id="pause-btn">Pause</button>
                 <button id="reset-btn">Reset</button>
                  <label for="task-select">Select task</label>
                <select id="task-select"><option value="">Select a task</option></select>
                </section>
                <section class="weekly-section">
                    <h2>Weekly Progress</h2>
                    <div class="Weekly Chart">

                    </div>
                </section>

                
                
                
            </section>
        </main>
    </div>

<script src="dashboard.js"></script>
</body>
</html>
