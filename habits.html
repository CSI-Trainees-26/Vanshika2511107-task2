<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>Fitness Tracker</h2>
            </div>
            <nav class="sidebar-nav">
            
                <ul class="nav-list">
                    <li><a href="index.html">Dashboard🏠</a></li>
                    <li><a href="task.html">Tasks✅</a></li>
                    <li><a href="habits.html" class="active">Habits🏃</a></li>
                    <li><a href="water.html">Water💧</a></li>
                    <li><a href="sleep.html">Sleep😴</a></li>
                    <li><a href="quotes.html">Quotes💭</a></li>
                    <li><a href="summary.html">Summary📊</a></li>
                </ul>
            </nav>       
            
        </aside>
        <main class="main-content">
            <h1>Habit Tracker</h1>
            <section class="habit-form-section">
                <h2>Habit Name</h2>
                <label for="habit-name">Habit Name</label>
                <input type="text" id="habit-input" placeholder="Enter your habit">
                <label for="habit-category">Category</label>
                <select id="habit-category">
                    <option value="workout">Workout</option>
                    <option value="fitness">Fitness</option>
                    <option value="cardio">Cardio</option>
                    <option value="mental-wellness">Mental Wellness</option>
                </select>
                <button id="add-habit-btn">Add habit</button>
            </section>
            <section class="today-habits-section">
                <h2>Today's Habit</h2>
                <div id="habit-list">

                </div>
            </section>
            <section class="habit-activity-section">
               <h2>Habit Activity</h2>

                <div id="habit-graph">

                </div>
            </section>

            
        </main>
    </div>
</body>
</html>
